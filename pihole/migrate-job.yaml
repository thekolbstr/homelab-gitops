# One-shot migration job. Upload your Ubuntu pihole data to the NAS at
# 192.168.0.183 first, laid out exactly like this under /volume1/Storage/pihole-migration:
#
#   /volume1/Storage/pihole-migration/etc-pihole/      <- contents of /etc/pihole
#   /volume1/Storage/pihole-migration/dnsmasq.d/        <- contents of /etc/dnsmasq.d
#
# Then, after `kubectl apply -f pihole/resources.yaml` has created the
# pihole-migration-pvc and pihole-config-pvc:
#
#   kubectl apply -f pihole/migrate-job.yaml
#   kubectl logs -n pihole -f job/pihole-migrate
#   kubectl delete -f pihole/migrate-job.yaml   # cleanup once confirmed
#
apiVersion: batch/v1
kind: Job
metadata:
  name: pihole-migrate
  namespace: pihole
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: alpine:3.20
        command:
        - sh
        - -c
        - |
          set -eu
          echo "Source contents:"
          ls -la /migration
          mkdir -p /dest/etc-pihole /dest/dnsmasq.d
          echo "Copying /etc/pihole data..."
          cp -av /migration/etc-pihole/. /dest/etc-pihole/
          echo "Copying /etc/dnsmasq.d data..."
          cp -av /migration/dnsmasq.d/. /dest/dnsmasq.d/
          echo "Done. Destination contents:"
          ls -la /dest/etc-pihole /dest/dnsmasq.d
        volumeMounts:
        - mountPath: /migration
          name: migration-source
          readOnly: true
        - mountPath: /dest
          name: config-dest
      volumes:
      - name: migration-source
        persistentVolumeClaim:
          claimName: pihole-migration-pvc
      - name: config-dest
        persistentVolumeClaim:
          claimName: pihole-config-pvc
