apiVersion: apps/v1
kind: Deployment
metadata:
  name: bark
  namespace: bark
  labels:
    app: bark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bark
  template:
    metadata:
      labels:
        app: bark
    spec:
      containers:
      - image: finab/bark-server:latest
        imagePullPolicy: Always
        name: bark
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: bark-pvc-rwo
---
apiVersion: v1
kind: Service
metadata:
  name: bark
  namespace: bark
spec:
  type: NodePort
  selector:
    app: bark
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30883
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bark-ingress
  namespace: bark
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: bark.fullsendbud.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bark
            port:
              number: 8080
  - host: bark.home.arpa
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bark
            port:
              number: 8080