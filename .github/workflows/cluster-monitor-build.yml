name: Build and push cluster-monitor backend image

on:
  push:
    branches: [main]
    paths:
      - 'cluster-monitor/backend/**'
      - '.github/workflows/cluster-monitor-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./cluster-monitor/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cluster-monitor:latest
            ghcr.io/${{ github.repository_owner }}/cluster-monitor:${{ github.sha }}
