apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tdarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thekolbstr/homelab-gitops.git
    targetRevision: main
    path: tdarr
  destination:
    server: https://kubernetes.default.svc
    namespace: tdarr
  syncPolicy:
    automated:
      prune: false
      selfHeal: true