apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thekolbstr/homelab-gitops.git
    targetRevision: main
    path: radarr
  destination:
    server: https://kubernetes.default.svc
    namespace: radarr
  syncPolicy:
    automated:
      prune: false
      selfHeal: true