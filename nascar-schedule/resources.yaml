apiVersion: v1
kind: ConfigMap
metadata:
  name: nascar-schedule-script
  namespace: nascar-schedule
data:
  nascar_schedule_server.py: |
    #!/usr/bin/env python3
    """
    NASCAR schedule + live helper server
    ------------------------------------
    Fetches NASCAR's full season schedule, computes per-series candidate/next
    race info, and serves a tiny JSON summary over plain HTTP for the ESP32
    to poll instead of hitting cf.nascar.com's large schedule file directly.

    Also polls each series' live-feed endpoint every 15s and serves a
    distilled /live.json - the ESP32 hit the same large-payload TLS problem
    fetching live-feed.json directly, so that's offloaded here too.

    NOTE: NASCAR's race_date strings have no timezone suffix but are actually
    Eastern local time (EST/EDT), not UTC.
    """
    import json
    import threading
    import time
    import urllib.request
    import ssl
    from datetime import datetime, timezone
    from zoneinfo import ZoneInfo
    from http.server import BaseHTTPRequestHandler, HTTPServer

    EASTERN = ZoneInfo("America/New_York")

    PORT = 8002
    SCHEDULE_REFRESH_SECONDS = 30 * 60
    LIVE_REFRESH_SECONDS = 15

    _schedule_lock = threading.Lock()
    _schedule_cache = {"generated_at": 0, "series": []}

    _live_lock = threading.Lock()
    _live_cache = {"generated_at": 0, "series": []}

    UA_HEADERS = {"User-Agent": "Mozilla/5.0"}


    def parse_iso_utc(date_str):
        try:
            dt = datetime.strptime(date_str, "%Y-%m-%dT%H:%M:%S")
            return dt.replace(tzinfo=EASTERN)
        except (ValueError, TypeError):
            return None


    def http_get_json(url, timeout=30):
        ctx = ssl.create_default_context()
        req = urllib.request.Request(url, headers=UA_HEADERS)
        with urllib.request.urlopen(req, timeout=timeout, context=ctx) as resp:
            return json.loads(resp.read().decode("utf-8"))


    def fetch_schedule():
        year = datetime.now(timezone.utc).year
        url = f"https://cf.nascar.com/cacher/{year}/race_list_basic.json"
        data = http_get_json(url)

        now = datetime.now(timezone.utc)
        series_out = []

        for series_id, key in ((1, "series_1"), (2, "series_2"), (3, "series_3")):
            races = data.get(key, [])

            candidate = None
            upcoming = None

            for r in races:
                race_date = parse_iso_utc(r.get("race_date", ""))
                if race_date is None:
                    continue

                if race_date <= now:
                    if candidate is None or race_date > candidate["_date"]:
                        candidate = {
                            "race_id": r.get("race_id"),
                            "race_name": r.get("race_name", ""),
                            "track_name": r.get("track_name", ""),
                            "_date": race_date,
                        }
                else:
                    if upcoming is None or race_date < upcoming["_date"]:
                        upcoming = {
                            "race_name": r.get("race_name", ""),
                            "track_name": r.get("track_name", ""),
                            "_date": race_date,
                        }

            entry = {"series_id": series_id}

            if candidate:
                entry["candidate_race_id"] = candidate["race_id"]
                entry["candidate_race_name"] = candidate["race_name"]
                entry["candidate_track_name"] = candidate["track_name"]

            if upcoming:
                entry["next_race_name"] = upcoming["race_name"]
                entry["next_track_name"] = upcoming["track_name"]
                entry["next_seconds_until"] = int((upcoming["_date"] - now).total_seconds())

            series_out.append(entry)

        return {"generated_at": int(now.timestamp()), "series": series_out}


    def fetch_live_for_series(series_id, race_id):
        url = f"https://cf.nascar.com/cacher/live/series_{series_id}/{race_id}/live-feed.json"
        data = http_get_json(url, timeout=15)

        flag_state = data.get("flag_state", 0)
        vehicles = data.get("vehicles", []) or []

        entry = {
            "series_id": series_id,
            "flag_state": flag_state,
            "lap_number": data.get("lap_number", 0),
            "laps_in_race": data.get("laps_in_race", 0),
            "laps_to_go": data.get("laps_to_go", 0),
            "run_name": data.get("run_name", ""),
            "track_name": data.get("track_name", ""),
        }

        is_live = flag_state in (1, 2, 3, 4) and len(vehicles) > 0
        entry["is_live"] = is_live

        drivers = []
        if is_live:
            for v in vehicles:
                driver = v.get("driver") or {}
                drivers.append({
                    "position": v.get("running_position", 0),
                    "number": str(v.get("vehicle_number", "")),
                    "name": driver.get("full_name", ""),
                    "on_track": bool(v.get("is_on_track", True)),
                })
            drivers.sort(key=lambda d: d["position"])

        entry["drivers"] = drivers
        return entry


    def schedule_refresh_loop():
        while True:
            try:
                result = fetch_schedule()
                with _schedule_lock:
                    _schedule_cache.clear()
                    _schedule_cache.update(result)
                print(f"[{datetime.now()}] Schedule refreshed OK: "
                      f"{[ (s['series_id'], s.get('candidate_race_id')) for s in result['series'] ]}")
            except Exception as e:
                print(f"[{datetime.now()}] Schedule refresh FAILED: {e}")
            time.sleep(SCHEDULE_REFRESH_SECONDS)


    def live_refresh_loop():
        while True:
            try:
                with _schedule_lock:
                    candidates = [
                        (s["series_id"], s.get("candidate_race_id"))
                        for s in _schedule_cache.get("series", [])
                        if s.get("candidate_race_id")
                    ]

                series_out = []
                for series_id, race_id in candidates:
                    try:
                        series_out.append(fetch_live_for_series(series_id, race_id))
                    except Exception as e:
                        print(f"[{datetime.now()}] Live fetch FAILED for series {series_id} "
                              f"race {race_id}: {e}")
                        series_out.append({"series_id": series_id, "is_live": False, "drivers": []})

                with _live_lock:
                    _live_cache.clear()
                    _live_cache.update({
                        "generated_at": int(datetime.now(timezone.utc).timestamp()),
                        "series": series_out,
                    })

                print(f"[{datetime.now()}] Live refreshed: "
                      f"{[ (s['series_id'], s.get('is_live'), s.get('flag_state')) for s in series_out ]}")
            except Exception as e:
                print(f"[{datetime.now()}] Live refresh loop error: {e}")
            time.sleep(LIVE_REFRESH_SECONDS)


    class Handler(BaseHTTPRequestHandler):
        def _send_json(self, obj):
            body = json.dumps(obj).encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            path = self.path.rstrip("/")
            if path in ("", "/schedule.json"):
                with _schedule_lock:
                    self._send_json(dict(_schedule_cache))
            elif path == "/live.json":
                with _live_lock:
                    self._send_json(dict(_live_cache))
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            pass


    if __name__ == "__main__":
        print("Doing initial schedule fetch...")
        try:
            with _schedule_lock:
                _schedule_cache.update(fetch_schedule())
            print("Initial schedule fetch OK.")
        except Exception as e:
            print(f"Initial schedule fetch failed (will retry in background): {e}")

        threading.Thread(target=schedule_refresh_loop, daemon=True).start()
        threading.Thread(target=live_refresh_loop, daemon=True).start()

        print(f"Serving schedule.json + live.json on http://0.0.0.0:{PORT}/")
        HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nascar-schedule
  namespace: nascar-schedule
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nascar-schedule
  template:
    metadata:
      labels:
        app: nascar-schedule
    spec:
      containers:
        - name: nascar-schedule
          image: python:3.11-slim
          command: ["sh", "-c", "pip install --quiet --no-cache-dir tzdata && python3 /app/nascar_schedule_server.py"]
          ports:
            - containerPort: 8002
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: nascar-schedule-script
---
apiVersion: v1
kind: Service
metadata:
  name: nascar-schedule
  namespace: nascar-schedule
spec:
  type: NodePort
  selector:
    app: nascar-schedule
  ports:
    - port: 8002
      targetPort: 8002
      nodePort: 30802
