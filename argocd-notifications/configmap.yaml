apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.webhook.gotify: |
    url: https://gotify.fullsendbud.xyz
    headers:
    - name: Content-Type
      value: application/json
  service.webhook.bark: |
    url: https://bark.fullsendbud.xyz
    headers:
    - name: Content-Type
      value: application/json
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [app-sync-succeeded]
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]
  template.app-sync-succeeded: |
    webhook:
      gotify:
        method: POST
        path: /message?token=$gotify-token
        body: |
          {"title": "{{.app.metadata.name}} deployed", "message": "Sync succeeded, revision {{.app.status.sync.revision}}", "priority": 5}
      bark:
        method: POST
        path: /push
        body: |
          {"device_key": "$bark-device-key", "title": "{{.app.metadata.name}} deployed", "body": "Sync succeeded"}
  template.app-sync-failed: |
    webhook:
      gotify:
        method: POST
        path: /message?token=$gotify-token
        body: |
          {"title": "{{.app.metadata.name}} sync FAILED", "message": "Check ArgoCD for details", "priority": 8}
      bark:
        method: POST
        path: /push
        body: |
          {"device_key": "$bark-device-key", "title": "{{.app.metadata.name}} sync FAILED", "body": "Check ArgoCD"}
  subscriptions: |
    - recipients:
      - gotify
      - bark
      triggers:
      - on-sync-succeeded
      - on-sync-failed