apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: proxmox-mcp-data
  namespace: tools
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: proxmox-mcp-data-longhorn
  namespace: tools
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
