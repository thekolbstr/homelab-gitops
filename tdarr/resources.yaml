apiVersion: v1
kind: PersistentVolume
metadata:
  name: appdata-pv-tdarr
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 100Gi
  mountOptions:
  - noatime
  - nodiratime
  - rsize=131072
  - wsize=131072
  - nfsvers=4.1
  - hard
  - timeo=600
  - retrans=2
  nfs:
    path: /volume1/Storage/appdata
    server: 192.168.0.183
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appdata-pvc
  namespace: tdarr
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: ""
  volumeName: appdata-pv-tdarr
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data-pv-tdarr
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 500Gi
  nfs:
    path: /volume1/Storage/data
    server: 192.168.0.183
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data-pvc
  namespace: tdarr
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: ""
  volumeName: media-data-pv-tdarr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr
  namespace: tdarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tdarr
  template:
    metadata:
      labels:
        app: tdarr
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: gpu
                operator: In
                values:
                - rtx3060
                - teslap4
      runtimeClassName: nvidia
      containers:
      - env:
        - name: TZ
          value: America/New_York
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: serverIP
          value: 0.0.0.0
        - name: serverPort
          value: "8266"
        - name: webUIPort
          value: "8265"
        - name: internalNode
          value: "true"
        - name: inContainer
          value: "true"
        - name: ffmpegVersion
          value: "6"
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
        image: haveagitgat/tdarr:latest
        name: tdarr
        ports:
        - containerPort: 8265
          name: webui
        - containerPort: 8266
          name: server
        volumeMounts:
        - mountPath: /app/configs
          name: appdata
          subPath: tdarr/config
        - mountPath: /app/server
          name: appdata
          subPath: tdarr/server
        - mountPath: /app/logs
          name: appdata
          subPath: tdarr/logs
        - mountPath: /temp
          name: transcode
        - mountPath: /media
          name: media
        readinessProbe:
          tcpSocket:
            port: 8265
          initialDelaySeconds: 15
          periodSeconds: 15
        livenessProbe:
          tcpSocket:
            port: 8265
          initialDelaySeconds: 30
          periodSeconds: 20
      volumes:
      - name: appdata
        persistentVolumeClaim:
          claimName: appdata-pvc
      - name: transcode
        emptyDir: {}
      - name: media
        persistentVolumeClaim:
          claimName: media-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tdarr
  namespace: tdarr
spec:
  type: NodePort
  selector:
    app: tdarr
  ports:
  - name: webui
    port: 8265
    targetPort: 8265
    nodePort: 30265
  - name: server
    port: 8266
    targetPort: 8266
    nodePort: 30266
---
apiVersion: v1
kind: Service
metadata:
  name: tdarr-internal
  namespace: tdarr
spec:
  type: ClusterIP
  selector:
    app: tdarr
  ports:
  - name: webui
    port: 8265
    targetPort: 8265
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tdarr
  namespace: tdarr
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: tdarr.home.arpa
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tdarr-internal
            port:
              number: 8265
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tdarr
  namespace: tdarr
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: tdarr
