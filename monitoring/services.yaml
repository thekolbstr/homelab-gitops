apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: alertmanager
  ports:
  - port: 9093
    targetPort: 9093
    nodePort: 30093
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-ntfy
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: alertmanager-ntfy
  ports:
  - name: homelab
    port: 8000
    targetPort: 8000
  - name: media
    port: 8001
    targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: blackbox-exporter
  ports:
  - port: 9115
    targetPort: 9115
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: kube-state-metrics
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30900
