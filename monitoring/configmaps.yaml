apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: homelab-alerts
      routes:
        - match:
            alertgroup: media
          receiver: media-alerts

    receivers:
      - name: homelab-alerts
        webhook_configs:
          - url: 'http://gotify-alertmanager.monitoring.svc.cluster.local:8080/homelab'
            send_resolved: true

      - name: media-alerts
        webhook_configs:
          - url: 'http://gotify-alertmanager.monitoring.svc.cluster.local:8080/media'
            send_resolved: true
---
apiVersion: v1
