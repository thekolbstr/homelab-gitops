apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - resources.yaml
# tailscale-auth Secret is intentionally NOT included here -- it holds a live
# auth key/credential and should never be committed to git in plaintext.
# It's created directly in-cluster (see README.md in this folder) rather
# than via GitOps, same reasoning as any other homelab secret you'd normally
# seal -- this one's simpler to just create imperatively since it's a
# one-time bootstrap credential, not something that needs to change often.
