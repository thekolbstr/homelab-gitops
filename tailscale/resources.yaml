apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tailscale-state-pvc
  namespace: tailscale
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subnet-router
  namespace: tailscale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: subnet-router
  template:
    metadata:
      labels:
        app: subnet-router
    spec:
      initContainers:
      - name: sysctl
        image: busybox:1.36
        securityContext:
          privileged: true
        command:
        - sh
        - -c
        - sysctl -w net.ipv4.ip_forward=1 && sysctl -w net.ipv6.conf.all.forwarding=1
      containers:
      - name: tailscale
        image: tailscale/tailscale:latest
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: TS_AUTHKEY
        - name: TS_ROUTES
          value: "192.168.0.0/24"
        - name: TS_EXTRA_ARGS
          value: "--accept-dns=false"
        - name: TS_HOSTNAME
          value: "k3s-subnet-router"
        - name: TS_STATE_DIR
          value: "/var/lib/tailscale"
        - name: TS_KUBE_SECRET
          value: ""
        - name: TS_USERSPACE
          value: "false"
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        volumeMounts:
        - mountPath: /dev/net/tun
          name: dev-net-tun
        - mountPath: /var/lib/tailscale
          name: state
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - tailscale status --json | grep -q '"BackendState":"Running"'
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - tailscale status --json | grep -q '"BackendState":"Running"'
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
      - name: state
        persistentVolumeClaim:
          claimName: tailscale-state-pvc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: subnet-router
  namespace: tailscale
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: subnet-router
