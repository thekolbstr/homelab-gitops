apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appdata-pvc
  namespace: media
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: ""
  volumeName: appdata-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data-pvc
  namespace: media
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: ""
  volumeName: media-data-pv
---
# Single-consumer app config volumes migrated from Longhorn RWX (NFS
# share-manager) to Longhorn RWO (native block/iSCSI). RWX was causing
# SQLite corruption and "database is busy" write-lock timeouts under
# these apps' WAL-mode databases. None of these are shared across
# multiple pods, so RWO is correct and faster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bark-pvc-rwo
  namespace: media
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
