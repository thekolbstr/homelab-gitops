apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appdata-pvc
  namespace: media
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: ""
  volumeName: appdata-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data-pvc
  namespace: media
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: ""
  volumeName: media-data-pv
---
# Longhorn PVC for dispatcharr's Postgres data directory, migrated off the
# hostPath volume that pinned vpn-stack to node "worker". See deployments.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dispatcharr-db-pvc
  namespace: media
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  volumeName: dispatcharr-vol-restored
  resources:
    requests:
      storage: 1Gi
