# SECURITY WARNING: the live deployment currently has WIREGUARD_PRIVATE_KEY as a
# plaintext env var. DO NOT commit the real key value to Git. Before importing this
# to GitOps, move it into a Kubernetes Secret (referenced via envFrom/secretKeyRef)
# and manage that secret out-of-band (sealed-secrets, SOPS, or your password manager) â€”
# never as plain data in this repo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-stack
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vpn-stack
  template:
    metadata:
      labels:
        app: vpn-stack
    spec:
      containers:
      - name: gluetun
        image: qmcgaw/gluetun:latest
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        env:
        - name: VPN_SERVICE_PROVIDER
          value: nordvpn
        - name: VPN_TYPE
          value: wireguard
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: vpn-stack-secrets   # create this Secret out-of-band, do not commit the key
              key: wireguard-private-key
        - name: SERVER_COUNTRIES
          value: United States
        - name: SERVER_CITIES
          value: New York
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: 10.0.0.0/8,192.168.0.0/24
        volumeMounts:
        - mountPath: /dev/net/tun
          name: tun
      - name: dispatcharr
        image: ghcr.io/dispatcharr/dispatcharr:latest
        ports:
        - containerPort: 9191
        volumeMounts:
        - mountPath: /data
          name: appdata
          subPath: dispatcharr
        - mountPath: /data/db
          name: dispatcharr-db
      - name: sabnzbd
        image: lscr.io/linuxserver/sabnzbd:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: America/New_York
        ports:
        - containerPort: 8080
        volumeMounts:
        - mountPath: /config
          name: appdata
          subPath: sabnzbd
        - mountPath: /data
          name: data
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: America/New_York
        - name: WEBUI_PORT
          value: "8090"
        ports:
        - containerPort: 8090
        - containerPort: 6881
        - containerPort: 6881
          protocol: UDP
        volumeMounts:
        - mountPath: /config
          name: appdata
          subPath: qbittorrent
        - mountPath: /data
          name: data
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: America/New_York
        ports:
        - containerPort: 9696
        volumeMounts:
        - mountPath: /config
          name: appdata
          subPath: prowlarr
      - name: byparr
        image: ghcr.io/thephaseless/byparr:latest
        env:
        - name: LOG_LEVEL
          value: info
        - name: TZ
          value: America/New_York
        ports:
        - containerPort: 8191
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
      - name: appdata
        persistentVolumeClaim:
          claimName: appdata-pvc
      - name: data
        persistentVolumeClaim:
          claimName: media-data-pvc
      - name: dispatcharr-db
        persistentVolumeClaim:
          claimName: dispatcharr-db-pvc
