apiVersion: apps/v1
kind: Deployment
metadata:
  name: bark
  namespace: media
  labels:
    app: bark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bark
  template:
    metadata:
      labels:
        app: bark
    spec:
      containers:
      - image: finab/bark-server:latest
        imagePullPolicy: Always
        name: bark
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: bark-pvc-longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotify
  namespace: media
  labels:
    app: gotify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotify
  template:
    metadata:
      labels:
        app: gotify
    spec:
      containers:
      - env:
        - name: GOTIFY_SERVER_PORT
          value: "80"
        - name: GOTIFY_DEFAULTUSER_NAME
          value: kolby
        - name: GOTIFY_DEFAULTUSER_PASS
          value: changeme  # NOTE: only applies on brand-new DB creation; live admin creds were reset via SQL — see chat history.
        image: gotify/server:latest
        name: gotify
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /app/data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: gotify-pvc-longhorn
---
