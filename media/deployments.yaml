apiVersion: apps/v1
kind: Deployment
metadata:
  name: igotify
  namespace: media
  labels:
    app: igotify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igotify
  template:
    metadata:
      labels:
        app: igotify
    spec:
      containers:
      - env:
        - name: GOTIFY_URLS
          value: http://gotify.fullsendbud.xyz
        - name: GOTIFY_CLIENT_TOKENS
          value: CpqqIlawE8W1T4S
        image: ghcr.io/androidseb25/igotify-notification-assist:latest
        name: igotify
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /app/data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: igotify-pvc-longhorn
  # NOTE: iGotify persists GOTIFY_URLS/GOTIFY_CLIENT_TOKENS into its own SQLite DB
  # (/app/data/users.db) on first boot and ignores env var changes afterward.
  # Changing these values here will NOT reconfigure an already-initialized instance —
  # the DB must be edited directly (see chat history) or the PVC wiped for a fresh start.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  annotations:
    keel.sh/policy: force
    keel.sh/pollSchedule: '@every 24h'
    keel.sh/trigger: poll
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: gpu
                operator: In
                values:
                - rtx3060
                - teslap4
      runtimeClassName: nvidia
      containers:
      - env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: America/New_York
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,video,utility
        - name: JELLYFIN_PublishedServerUrl
          value: http://192.168.0.195:8096
        image: lscr.io/linuxserver/jellyfin:latest
        name: jellyfin
        ports:
        - containerPort: 8096
        volumeMounts:
        - mountPath: /config
          name: jellyfin-config
        - mountPath: /data
          name: data
        - mountPath: /config/transcodes
          name: transcode
      volumes:
      - name: jellyfin-config
        persistentVolumeClaim:
          claimName: jellyfin-pvc-longhorn
      - name: data
        persistentVolumeClaim:
          claimName: media-data-pvc
      - name: transcode
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
