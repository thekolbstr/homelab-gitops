apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: igotify-pvc-rwo
  namespace: igotify
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  volumeName: pvc-933a68f4-0436-4638-98b8-ebe7ace0f6f0
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igotify
  namespace: igotify
  labels:
    app: igotify
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igotify
  template:
    metadata:
      labels:
        app: igotify
    spec:
      containers:
      - env:
        - name: GOTIFY_URLS
          value: http://gotify.fullsendbud.xyz
        - name: GOTIFY_CLIENT_TOKENS
          value: CpqqIlawE8W1T4S
        image: ghcr.io/androidseb25/igotify-notification-assist:latest
        name: igotify
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /app/data
          name: data
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: igotify-pvc-rwo
---
apiVersion: v1
kind: Service
metadata:
  name: igotify
  namespace: igotify
spec:
  type: NodePort
  selector:
    app: igotify
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30882
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: igotify-ingress
  namespace: igotify
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: igotify.fullsendbud.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: igotify
            port:
              number: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: igotify
  namespace: igotify
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: igotify
